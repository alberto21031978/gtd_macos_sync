<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GTD Desktop - MacBook Pro 13"</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", Helvetica, Arial, sans-serif;
      user-select: none;
    }
    .custom-scroll::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 3px;
    }
  </style>
</head>
<body class="bg-neutral-950 text-neutral-100 h-screen flex flex-col overflow-hidden">

  <!-- macOS Window Titlebar -->
  <header class="h-10 bg-neutral-900 border-b border-neutral-800 flex items-center justify-between px-4 select-none shrink-0">
    <div class="flex items-center space-x-2">
      <div class="flex space-x-1.5 mr-2">
        <span class="w-3 h-3 rounded-full bg-red-500 inline-block"></span>
        <span class="w-3 h-3 rounded-full bg-yellow-500 inline-block"></span>
        <span class="w-3 h-3 rounded-full bg-emerald-500 inline-block"></span>
      </div>
      <span class="text-xs font-semibold text-neutral-300">GTD Desktop — 13" MacBook Pro</span>
    </div>

    <!-- Quick action buttons -->
    <div class="flex items-center space-x-2">
      <button onclick="readFromClipboard()" class="px-2.5 py-1 text-xs bg-neutral-800 hover:bg-neutral-700 rounded border border-neutral-700 flex items-center space-x-1.5">
        <i class="fa-solid fa-paste text-blue-400"></i>
        <span>Incolla Appunti</span>
      </button>
      <button onclick="toggleCloudSyncModal()" class="px-2.5 py-1 text-xs bg-neutral-800 hover:bg-neutral-700 rounded border border-neutral-700 flex items-center space-x-1.5">
        <i class="fa-solid fa-cloud text-indigo-400"></i>
        <span>Sync Cloud</span>
      </button>
    </div>
  </header>

  <!-- Split View Layout -->
  <div class="flex flex-1 overflow-hidden">
    
    <!-- Left Sidebar -->
    <aside class="w-56 bg-neutral-900/60 border-r border-neutral-800 flex flex-col justify-between p-3 select-none shrink-0">
      <div class="space-y-1">
        <div class="text-[10px] font-bold text-neutral-500 uppercase px-2 mb-1 tracking-wider">Flusso GTD</div>
        <button onclick="selectCategory('inbox')" class="cat-btn w-full flex items-center justify-between px-2.5 py-1.5 rounded-lg text-xs font-medium text-left bg-blue-600/20 text-blue-400" data-cat="inbox">
          <span class="flex items-center space-x-2"><i class="fa-solid fa-tray w-4"></i><span>Inbox</span></span>
          <span id="badge-inbox" class="text-[10px] bg-neutral-800 px-1.5 py-0.5 rounded-full text-neutral-300">0</span>
        </button>
        <button onclick="selectCategory('actions')" class="cat-btn w-full flex items-center justify-between px-2.5 py-1.5 rounded-lg text-xs font-medium text-left text-neutral-400 hover:bg-neutral-800/50" data-cat="actions">
          <span class="flex items-center space-x-2"><i class="fa-solid fa-bolt w-4"></i><span>Prossime Azioni</span></span>
          <span id="badge-actions" class="text-[10px] bg-neutral-800 px-1.5 py-0.5 rounded-full text-neutral-300">0</span>
        </button>
        <button onclick="selectCategory('projects')" class="cat-btn w-full flex items-center justify-between px-2.5 py-1.5 rounded-lg text-xs font-medium text-left text-neutral-400 hover:bg-neutral-800/50" data-cat="projects">
          <span class="flex items-center space-x-2"><i class="fa-solid fa-diagram-project w-4"></i><span>Progetti</span></span>
          <span id="badge-projects" class="text-[10px] bg-neutral-800 px-1.5 py-0.5 rounded-full text-neutral-300">0</span>
        </button>
        <button onclick="selectCategory('waiting')" class="cat-btn w-full flex items-center justify-between px-2.5 py-1.5 rounded-lg text-xs font-medium text-left text-neutral-400 hover:bg-neutral-800/50" data-cat="waiting">
          <span class="flex items-center space-x-2"><i class="fa-solid fa-clock w-4"></i><span>In Attesa</span></span>
          <span id="badge-waiting" class="text-[10px] bg-neutral-800 px-1.5 py-0.5 rounded-full text-neutral-300">0</span>
        </button>
        <button onclick="selectCategory('someday')" class="cat-btn w-full flex items-center justify-between px-2.5 py-1.5 rounded-lg text-xs font-medium text-left text-neutral-400 hover:bg-neutral-800/50" data-cat="someday">
          <span class="flex items-center space-x-2"><i class="fa-solid fa-box-archive w-4"></i><span>Un Giorno / Forse</span></span>
          <span id="badge-someday" class="text-[10px] bg-neutral-800 px-1.5 py-0.5 rounded-full text-neutral-300">0</span>
        </button>
      </div>

      <!-- Quick Add Widget -->
      <div class="border-t border-neutral-800 pt-3">
        <button onclick="showNewTaskModal()" class="w-full py-2 bg-blue-600 hover:bg-blue-500 rounded-lg text-xs font-semibold flex items-center justify-center space-x-1.5">
          <i class="fa-solid fa-plus"></i>
          <span>Nuovo Compito</span>
        </button>
      </div>
    </aside>

    <!-- Main Content List -->
    <main class="flex-1 flex flex-col bg-neutral-950 overflow-hidden">
      <!-- Toolbar -->
      <div class="h-12 border-b border-neutral-800 px-6 flex items-center justify-between shrink-0">
        <h1 id="view-title" class="text-sm font-bold text-neutral-200">Inbox (Da Chiarire)</h1>
        <div class="text-xs text-neutral-500" id="item-count-label">0 elementi</div>
      </div>

      <!-- Scrollable List Container -->
      <div id="items-list" class="flex-1 overflow-y-auto custom-scroll p-6 space-y-3">
        <!-- Rendered items -->
      </div>
    </main>

  </div>

  <!-- Sync Modal -->
  <div id="sync-modal" class="fixed inset-0 z-50 bg-black/60 hidden flex items-center justify-center p-4">
    <div class="bg-neutral-900 border border-neutral-800 rounded-xl w-96 p-5 space-y-4">
      <div class="flex justify-between items-center border-b border-neutral-800 pb-2">
        <h3 class="font-semibold text-xs uppercase tracking-wider text-neutral-300">Sincronizzazione JSONBin</h3>
        <button onclick="toggleCloudSyncModal()" class="text-neutral-500 hover:text-white">&times;</button>
      </div>
      <div class="space-y-3 text-xs">
        <div>
          <label class="text-neutral-400">Master Key</label>
          <input type="password" id="sync-key" class="w-full mt-1 bg-neutral-950 border border-neutral-800 rounded p-2 text-white">
        </div>
        <div>
          <label class="text-neutral-400">Bin ID</label>
          <input type="text" id="sync-bin" class="w-full mt-1 bg-neutral-950 border border-neutral-800 rounded p-2 text-white">
        </div>
        <div class="flex space-x-2 pt-2">
          <button onclick="uploadToCloud()" class="flex-1 py-2 rounded bg-blue-600 hover:bg-blue-500 font-medium">Invia al Cloud ⬆</button>
          <button onclick="downloadFromCloud()" class="flex-1 py-2 rounded bg-neutral-800 hover:bg-neutral-700 border border-neutral-700 font-medium">Scarica ⬇</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    let gtdData = JSON.parse(localStorage.getItem('gtd_data_mac')) || {
      inbox: [],
      actions: [],
      projects: [],
      waiting: [],
      someday: []
    };

    let activeCategory = 'inbox';

    function saveData() {
      localStorage.setItem('gtd_data_mac', JSON.stringify(gtdData));
      updateBadges();
      renderList();
    }

    function updateBadges() {
      ['inbox', 'actions', 'projects', 'waiting', 'someday'].forEach(cat => {
        const el = document.getElementById(`badge-${cat}`);
        if (el) el.textContent = gtdData[cat].length;
      });
    }

    function selectCategory(cat) {
      activeCategory = cat;
      document.querySelectorAll('.cat-btn').forEach(btn => {
        const isCurrent = btn.dataset.cat === cat;
        btn.classList.toggle('bg-blue-600/20', isCurrent);
        btn.classList.toggle('text-blue-400', isCurrent);
        btn.classList.toggle('text-neutral-400', !isCurrent);
      });
      renderList();
    }

    function renderList() {
      const titles = {
        inbox: 'Inbox (Da Chiarire)',
        actions: 'Prossime Azioni',
        projects: 'Progetti Attivi',
        waiting: 'In Attesa di Terzi',
        someday: 'Un Giorno / Forse'
      };
      document.getElementById('view-title').textContent = titles[activeCategory];
      const list = gtdData[activeCategory] || [];
      document.getElementById('item-count-label').textContent = `${list.length} elementi`;

      const container = document.getElementById('items-list');
      if (list.length === 0) {
        container.innerHTML = `<div class="h-full flex flex-col items-center justify-center text-neutral-600 py-20 text-xs">
          <i class="fa-regular fa-folder-open text-4xl mb-3"></i>
          <span>Nessun elemento in questa sezione.</span>
        </div>`;
        return;
      }

      container.innerHTML = list.map((item, idx) => `
        <div class="bg-neutral-900 border border-neutral-800 rounded-xl p-4 flex items-start justify-between hover:border-neutral-700 transition">
          <div class="space-y-1">
            <h3 class="text-sm font-semibold text-neutral-200">${escapeHtml(item.title)}</h3>
            ${item.details ? `<p class="text-xs text-neutral-400 whitespace-pre-wrap">${escapeHtml(item.details)}</p>` : ''}
            <div class="flex items-center space-x-2 pt-2 text-[11px] text-neutral-500">
              <span>${item.date || 'Oggi'}</span>
              ${item.context ? `<span class="bg-neutral-800 px-2 py-0.5 rounded text-neutral-400">${item.context}</span>` : ''}
            </div>
          </div>
          <div class="flex items-center space-x-2 ml-4">
            ${activeCategory === 'inbox' ? `
              <button onclick="clarifyItem(${idx})" class="px-2.5 py-1 text-xs bg-blue-600 hover:bg-blue-500 text-white rounded font-medium">Chiarisci ⚡</button>
            ` : ''}
            <button onclick="deleteItem('${activeCategory}', ${idx})" class="p-1.5 text-neutral-500 hover:text-red-400 rounded">
              <i class="fa-regular fa-trash-can"></i>
            </button>
          </div>
        </div>
      `).join('');
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function clarifyItem(idx) {
      const item = gtdData.inbox[idx];
      const action = prompt("Qual è la prossima azione fisica per:", item.title);
      if (action !== null) {
        gtdData.actions.push({
          title: action || item.title,
          details: item.details,
          context: '@Computer',
          date: new Date().toLocaleDateString()
        });
        gtdData.inbox.splice(idx, 1);
        saveData();
      }
    }

    function deleteItem(cat, idx) {
      gtdData[cat].splice(idx, 1);
      saveData();
    }

    function showNewTaskModal() {
      const t = prompt("Titolo nuovo elemento per l'Inbox:");
      if (t) {
        gtdData.inbox.push({
          title: t,
          details: '',
          date: new Date().toLocaleDateString()
        });
        saveData();
      }
    }

    async function readFromClipboard() {
      try {
        const text = await navigator.clipboard.readText();
        if (text) {
          gtdData.inbox.push({
            title: text.slice(0, 40) + (text.length > 40 ? '...' : ''),
            details: text,
            date: new Date().toLocaleDateString()
          });
          saveData();
          alert('Nota copiata dagli appunti in Inbox!');
        } else {
          alert('Appunti vuoti.');
        }
      } catch (err) {
        alert('Permesso per gli appunti non concesso.');
      }
    }

    function toggleCloudSyncModal() {
      document.getElementById('sync-key').value = localStorage.getItem('jsonbin_key') || '';
      document.getElementById('sync-bin').value = localStorage.getItem('jsonbin_bin') || '';
      document.getElementById('sync-modal').classList.toggle('hidden');
    }

    async function uploadToCloud() {
      const key = document.getElementById('sync-key').value.trim();
      const bin = document.getElementById('sync-bin').value.trim();
      if (!key || !bin) return alert('Inserisci Master Key e Bin ID');

      localStorage.setItem('jsonbin_key', key);
      localStorage.setItem('jsonbin_bin', bin);

      try {
        const res = await fetch(`https://api.jsonbin.io/v3/b/${bin}`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'X-Master-Key': key
          },
          body: JSON.stringify(gtdData)
        });
        if (res.ok) {
          alert('Dati sincronizzati con successo sul Cloud!');
          toggleCloudSyncModal();
        } else {
          alert('Errore sincronizzazione.');
        }
      } catch (e) {
        alert('Errore di connessione: ' + e.message);
      }
    }

    async function downloadFromCloud() {
      const key = document.getElementById('sync-key').value.trim();
      const bin = document.getElementById('sync-bin').value.trim();
      if (!key || !bin) return alert('Inserisci Master Key e Bin ID');

      try {
        const res = await fetch(`https://api.jsonbin.io/v3/b/${bin}/latest`, {
          headers: { 'X-Master-Key': key }
        });
        if (res.ok) {
          const json = await res.json();
          if (json.record) {
            gtdData = json.record;
            saveData();
            alert('Dati scaricati dal Cloud con successo!');
            toggleCloudSyncModal();
          }
        } else {
          alert('Errore nel recupero dati dal Cloud.');
        }
      } catch (e) {
        alert('Errore di connessione: ' + e.message);
      }
    }

    // On Load
    window.addEventListener('DOMContentLoaded', () => {
      updateBadges();
      renderList();
    });
  </script>
</body>
</html>
